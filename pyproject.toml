[project]
name = "polymarket-data-pipeline"
version = "0.1.0"
description = "End-to-end Data Engineering pipeline for Polymarket prediction markets"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pyspark>=3.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "spark*", "dashboard*"]
exclude = ["airflow*", "database*", "docs*", "infra*", "modules*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ingestion/tests", "spark/tests"]
